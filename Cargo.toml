[package]
name = "solar"
version = "0.1.0"
edition = "2021"
description = "INDI-driven solar/planetary imaging suite: camera, mount, and stream-based guiding"

[dependencies]
indi = "5"
# Pin: indi -> fitsrs 0.3.x expects wcs 0.4.1's WCSParams; wcs 0.4.2 added fields
# that break fitsrs 0.3.4's build. Force the compatible version across the tree.
wcs = "=0.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.35"
egui = "0.35"
# egui_plot is versioned one minor ahead of egui: egui_plot 0.36 depends on egui 0.35
# (egui_plot 0.35 pulls egui 0.34 → a duplicate-egui type mismatch). Keep this offset in sync.
egui_plot = "0.36"
arc-swap = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[[example]]
name = "probe"
path = "examples/probe.rs"

[[example]]
name = "guide_check"
path = "examples/guide_check.rs"

# Live video decoding is numeric-heavy: an unoptimized `image` JPEG decode of an 8 MP frame
# takes ~3.4 s (0.3 fps), which throttles the stream to a crawl in a plain `cargo run` debug
# build. Optimize dependencies fully (they rarely rebuild) and give our own crate a light
# opt-level so the per-frame decode/stretch loops are usable while incremental compiles stay
# fast. For real imaging sessions prefer `cargo run --release`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
